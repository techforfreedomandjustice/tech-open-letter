# This workflow will install Python dependencies, run update-letter.py

name: Update signatures and rebuild letter

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
  # So the one-off removal below takes effect on merge rather than waiting for
  # the next scheduled run. Limited to the files that drive the build: the
  # autopublish commits only touch docs/, so they never retrigger this.
  push:
    branches: [main]
    paths:
      - 'update-letter.py'
      - 'oneshot_remove_signature.py'
      - '.github/workflows/update-letter.yml'
  
jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4.1.6
      with:
        persist-credentials: false # otherwise, the token used is the GITHUB_TOKEN, instead of your personal token
        fetch-depth: 0 # otherwise, you will failed to push refs to dest repo    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5.1.0
      with:
        python-version: "3.10"
    # - name: Dotenv Action
      # uses: falti/dotenv-action@v1.1
    - name: Create env file
      run: |
          touch .env
          echo AIR_TABLE_API_KEY=${{ secrets.AIR_TABLE_API_KEY }} >> .env
          echo AIR_TABLE_BASE_ID=${{ secrets.AIR_TABLE_BASE_ID }} >> .env
          echo AIR_TABLE_ID=${{ secrets.AIR_TABLE_ID }} >> .env
          echo AIR_TABLE_NAME=${{ secrets.AIR_TABLE_NAME }} >> .env
          cat .env
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip python-dotenv
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    # One-off: honours a signatory's request to have their row removed.
    # Deletes at most one record and cannot fail the build. Remove once a run
    # logs "RESULT=not_found".
    - name: One-off signature removal request
      continue-on-error: true
      env:
        AIR_TABLE_API_KEY: ${{ secrets.AIR_TABLE_API_KEY }}
        AIR_TABLE_BASE_ID: ${{ secrets.AIR_TABLE_BASE_ID }}
        AIR_TABLE_NAME: ${{ secrets.AIR_TABLE_NAME }}
      run: |
        python oneshot_remove_signature.py
    - name: Compile HTML
      env: 
        AIR_TABLE_ID: ${{ secrets.AIR_TABLE_ID }}    
        AIR_TABLE_API_KEY : ${{ secrets.AIR_TABLE_API_KEY }}
        AIR_TABLE_BASE_ID : ${{ secrets.AIR_TABLE_BASE_ID }}
        AIR_TABLE_NAME : ${{ secrets.AIR_TABLE_NAME }}
      run: |
        python update-letter.py
    - name: Commit & Push changes
      uses: actions-js/push@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
